spring:
  application:
    name: task-manager-api
  profiles:
    default: dev
  datasource:
    url: jdbc:h2:mem:taskflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true

server:
  port: 8080

app:
  cors:
    allowed-origins:
      - http://localhost:4200

springdoc:
  swagger-ui:
    path: /swagger-ui.html
