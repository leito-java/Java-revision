name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  task-manager-api:
    name: Tests de l'API Spring Boot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projets/task-manager-api

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: projets/task-manager-api/pom.xml

      - name: Compiler et tester
        run: mvn --batch-mode --no-transfer-progress verify
